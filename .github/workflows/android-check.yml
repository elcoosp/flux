name: android-check

# FLUX-011 (CI pipelines) — Android quality gate.
# Runs the unit-test suites for the Kotlin adapter (adapters/ui-kotlin) and the
# Android runtime app (runtimes/android:app). Both modules are included via the
# frozen settings.gradle.kts, so their tests are covered with no manifest edits.
# The Android SDK platform must be present for the android application plugin to
# configure, so it is installed from the command-line tools on every run.

on:
  push:
    branches: ["**"]
    paths:
      - "runtimes/android/**"
      - "adapters/ui-kotlin/**"
      - "gradle/**"
      - "settings.gradle.kts"
  pull_request:
    branches: ["main"]
    paths:
      - "runtimes/android/**"
      - "adapters/ui-kotlin/**"
      - "gradle/**"
      - "settings.gradle.kts"

permissions:
  contents: read

jobs:
  android:
    name: gradlew :adapters:ui-kotlin:test :runtimes:android:app:test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & accept licenses
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37"

      - name: Export ANDROID_COMPOSE_CLASSPATH for the kotlinc codegen check
        # Mirrors the guarded export in rust-check.yml. `flux-codegen-kotlin`'s
        # `generated_kotlin_parses` test shells out to `kotlinc` to compile-check
        # the generated Compose; bare kotlinc cannot resolve androidx.compose.*
        # without the Compose compiler + Android runtime on its classpath, supplied
        # via the opt-in ANDROID_COMPOSE_CLASSPATH env var. After setup-android +
        # the platform install above, $ANDROID_HOME/platforms/android-37/android.jar
        # exists; the Compose compiler jar (in ~/.gradle) is provided by the
        # separate toolchain-provisioning task. This step exports the classpath
        # only when both artifacts are on disk, so it is a safe no-op until that
        # lands and activates the real check automatically.
        run: |
          platform_jar="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms/android-37/android.jar"
          compose_jar="$(find "$HOME/.gradle" -name 'compose-compiler-*.jar' 2>/dev/null | head -n1)"
          if [ -f "$platform_jar" ] && [ -n "$compose_jar" ]; then
            echo "ANDROID_COMPOSE_CLASSPATH=${platform_jar}:${compose_jar}" >> "$GITHUB_ENV"
            echo "exported ANDROID_COMPOSE_CLASSPATH for the kotlinc codegen check"
          else
            echo "Android/Compose toolchain not fully provisioned (missing ${platform_jar}${compose_jar:+ or compose-compiler jar}); ANDROID_COMPOSE_CLASSPATH left unset"
          fi

      - name: Run adapter & runtime unit tests
        run: ./gradlew :adapters:ui-kotlin:test :runtimes:android:app:test --no-daemon
