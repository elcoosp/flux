name: android-check

# FLUX-011 (CI pipelines) — Android quality gate.
# Hosts the real `flux-codegen-kotlin` kotlinc compile-check of the generated
# Compose. The generated Compose imports only androidx.compose.* (no android.*
# framework classes), so the kotlinc check needs the Compose runtime AARs + the
# Kotlin Compose compiler plugin on its classpath — both plain Maven artifacts
# downloadable from Google Maven without an Android platform. We provision them
# directly here (see "Provision Compose toolchain"), so the check runs without
# depending on `platforms;android-37` being installable on the runner.
#
# HARD GATE: the GitHub-hosted `ubuntu-24.04` image now preinstalls
# `platforms;android-37` (verified against actions/runner-images: Android SDK
# Platforms includes android-37.0/37.1/37.2-beta + Build-tools 37.0.0), which
# matches this repo's `compileSdk = 37`. So the Android app's Gradle tests no
# longer hit a missing-SDK environment failure and the gradle test step is HARD
# (no continue-on-error). The kotlinc codegen check is also HARD — it must pass
# for a 1.0 cut. (The Compose classpath is still provisioned from Google Maven
# so the kotlinc check does not depend on a full platform install.)

on:
  workflow_call:
  push:
    branches: ["**"]
    paths:
      - "runtimes/android/**"
      - "adapters/ui-kotlin/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "crates/flux-codegen-kotlin/**"
  pull_request:
    branches: ["main"]
    paths:
      - "runtimes/android/**"
      - "adapters/ui-kotlin/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "crates/flux-codegen-kotlin/**"

permissions:
  contents: read

jobs:
  android:
    name: gradlew tests + kotlinc codegen check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform (ubuntu-24.04 preinstalls android-37; fail if absent)
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37"

      - name: Provision Compose toolchain from Google Maven
        # Resolve the full Compose BOM (runtime/foundation/material3/ui +
        # navigation-compose + activity-compose + their annotation/collection/
        # lifecycle dependencies) into a classpath that kotlinc can use. The BOM
        # POM pins every managed version; we parse it, download each AAR (or JAR),
        # extract classes.jar from the AARs, and locate the Kotlin Compose
        # compiler plugin jar. No Android platform and no Gradle project needed.
        run: |
          set -uo pipefail
          BOM_VER="2026.08.00"
          KOTLIN_VER="2.4.10"
          GOOGLE="https://dl.google.com/dl/android/maven2"
          MAVEN="https://repo1.maven.org/maven2"
          WORK="$HOME/compose_prov"
          mkdir -p "$WORK/aars" "$WORK/jars"

          curl -fsSL "$GOOGLE/androidx/compose/compose-bom/$BOM_VER/compose-bom-$BOM_VER.pom" -o "$WORK/bom.pom"

          # Resolve BOM <properties> (e.g. ${navigationCompose.version}) so managed
          # dependencies that reference them get a concrete version.
          declare -A props
          while IFS='=' read -r k val; do
            [ -n "$k" ] && props["$k"]="$val"
          done < <(perl -0777 -ne 'while(/<properties>(.*?)<\/properties>/sg){my $p=$1; while($p=~/<([\w.]+)>([^<]+)<\/\1>/g){print "$1=$2\n"}}' "$WORK/bom.pom")

          # Each managed <dependency> in the BOM POM: groupId / artifactId / version.
          # Skip Kotlin Multiplatform stub artifacts ("*-linuxx64stubs" etc.) — they
          # are not on Google Maven and are irrelevant to the JVM/Android classpath.
          perl -0777 -ne 'while(/<dependency>(.*?)<\/dependency>/sg){print "$1\x00"}' "$WORK/bom.pom" \
            | while IFS= read -r -d '' dep; do
                g=$(printf '%s' "$dep" | grep -oE '<groupId>[^<]+' | sed 's/<groupId>//')
                a=$(printf '%s' "$dep" | grep -oE '<artifactId>[^<]+' | sed 's/<artifactId>//')
                v=$(printf '%s' "$dep" | grep -oE '<version>[^<]+' | sed 's/<version>//')
                # Substitute a ${prop} reference from the BOM properties, if present.
                if printf '%s' "$v" | grep -q '^\${.*}$'; then
                  key=$(printf '%s' "$v" | sed -E 's/^\$\{(.*)\}$/\1/')
                  v="${props[$key]:-}"
                fi
                case "$g" in androidx.*) ;; *) continue ;; esac
                case "$a" in *-linuxx64stubs|*-linuxarm64stubs|*-macos*stubs|*-mingwx64stubs|*-jsstubs|*-jvmstubs) continue ;; esac
                [ -z "$v" ] && continue
                path="${g//.//}/$a/$v"
                if curl -fsSL "$GOOGLE/$path/$a-$v.aar" -o "$WORK/aars/$a-$v.aar" 2>/dev/null \
                   && unzip -o -q "$WORK/aars/$a-$v.aar" classes.jar -d "$WORK/aars" 2>/dev/null \
                   && [ -f "$WORK/aars/classes.jar" ]; then
                  mv "$WORK/aars/classes.jar" "$WORK/jars/$a-$v.jar"
                elif curl -fsSL "$GOOGLE/$path/$a-$v.jar" -o "$WORK/jars/$a-$v.jar" 2>/dev/null; then
                  :
                else
                  echo "skip $g:$a:$v (no AAR/JAR on Google Maven)"
                fi
              done

          # The Kotlin Compose compiler plugin is a Kotlin/JVM artifact on Maven Central.
          curl -fsSL "$MAVEN/org/jetbrains/kotlin/kotlin-compose-compiler-plugin-embeddable/$KOTLIN_VER/kotlin-compose-compiler-plugin-embeddable-$KOTLIN_VER.jar" -o "$WORK/jars/compose-compiler.jar"
          # The Compose plugin (K2 FIR) references org.jetbrains.kotlin.com.intellij.psi.*
          # classes that live in kotlin-compiler-embeddable; kotlinc's own classpath
          # does not expose them to a standalone -Xplugin, so add it to the classpath.
          curl -fsSL "$MAVEN/org/jetbrains/kotlin/kotlin-compiler-embeddable/$KOTLIN_VER/kotlin-compiler-embeddable-$KOTLIN_VER.jar" -o "$WORK/jars/kotlin-compiler-embeddable.jar"
          # navigation-compose is not part of the Compose BOM's managed androidx.*
          # entries we download above; fetch it explicitly (pins from libs.versions.toml).
          NAV_COMPOSE_VER="2.9.8"
          if curl -fsSL "$GOOGLE/androidx/navigation/navigation-compose/$NAV_COMPOSE_VER/navigation-compose-$NAV_COMPOSE_VER.aar" -o "$WORK/aars/navigation-compose-$NAV_COMPOSE_VER.aar" 2>/dev/null \
             && unzip -o -q "$WORK/aars/navigation-compose-$NAV_COMPOSE_VER.aar" classes.jar -d "$WORK/aars" 2>/dev/null \
             && [ -f "$WORK/aars/classes.jar" ]; then
            mv "$WORK/aars/classes.jar" "$WORK/jars/navigation-compose-$NAV_COMPOSE_VER.jar"
          fi

          classpath="$(ls "$WORK/jars"/*.jar 2>/dev/null | tr '\n' ':')"
          classpath="${classpath%:}"
          echo "ANDROID_COMPOSE_CLASSPATH=$classpath" >> "$GITHUB_ENV"
          echo "ANDROID_COMPOSE_COMPILER=$WORK/jars/compose-compiler.jar" >> "$GITHUB_ENV"
          echo "ANDROID_COMPOSE_COMPILER_EMBEDDABLE=$WORK/jars/kotlin-compiler-embeddable.jar" >> "$GITHUB_ENV"
          echo "exported ANDROID_COMPOSE_CLASSPATH ($classpath) and ANDROID_COMPOSE_COMPILER"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: kotlinc compile-check of generated Compose (HARD)
        # Runs the real kotlinc compile-check now that the Compose classpath +
        # compiler plugin are provisioned above. Uses stable (flux-codegen-kotlin
        # and its deps compile without the nightly-only gpui-ui feature).
        # HARD GATE: a codegen defect (e.g. emitted Compose using an invalid Shape
        # API) must fail the release gate — fix flux-codegen-kotlin, do not relax
        # the check. This is the FLUX-069 / PRD-U contract that generated Compose
        # actually compiles.
        run: cargo test -p flux-codegen-kotlin generated_kotlin_parses -- --nocapture

      - name: Run adapter & runtime unit tests (HARD)
        # HARD GATE: ubuntu-24.04 preinstalls android-37, so the app Gradle tests
        # resolve the SDK and run. This is the Android half of the release gate —
        # a failing adapter/runtime test must red the tree.
        # FLUX-083: expose the shared wire fixture dir so the Kotlin decoder test
        # `rejects the shared FLUX-083 unsupported-version fixture` runs against the
        # committed `unsupported-version.bin` (cross-language lockstep with Rust/Swift).
        env:
          FLUX_WIRE_FIXTURES: fixtures/wire
        run: ./gradlew :adapters:ui-kotlin:test :runtimes:android:app:test --no-daemon
