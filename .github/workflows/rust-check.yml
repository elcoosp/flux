name: rust-check

# FLUX-011 (CI pipelines) — Rust quality gate.
# Runs the AGENTS.md Definition-of-Done checks for the whole Cargo workspace:
#   * cargo fmt --check
#   * cargo clippy -- -D warnings
#   * cargo test
#   * cargo doc
# Globs are workspace-wide, so as soon as a crate's real source lands (Phase 1+)
# it is automatically covered — no manifest edits required.
#
# Toolchain: nightly. The `flux-devtools-ui` crate's `gpui-ui` feature pins gpui
# at a `main` commit that uses unstable std features (e.g. `std::hint::cold_path`),
# so the clippy gate must run on nightly. See `Cargo.toml` for the gpui pin note.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "runtimes/**"
      - "adapters/**"
      - "**.md"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "runtimes/**"
      - "adapters/**"
      - "**.md"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: fmt, clippy, test, doc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Export ANDROID_COMPOSE_CLASSPATH for the kotlinc codegen check
        # `flux-codegen-kotlin`'s `generated_kotlin_parses` test shells out to
        # `kotlinc` to compile-check the generated Compose. Bare `kotlinc`
        # cannot resolve `androidx.compose.*` unless the Compose compiler and
        # the Android runtime are on its classpath, supplied via the opt-in
        # ANDROID_COMPOSE_CLASSPATH env var (see that test). This step derives
        # that classpath from a provisioned Android toolchain and exports it for
        # the `cargo test` step below — but only when the artifacts actually
        # exist on disk, so it is a safe no-op until the toolchain is fully
        # provisioned (a separate infrastructure task) and the test skips
        # cleanly otherwise.
        run: |
          platform_jar="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms/android-37/android.jar"
          compose_jar="$(find "$HOME/.gradle" -name 'compose-compiler-*.jar' 2>/dev/null | head -n1)"
          if [ -f "$platform_jar" ] && [ -n "$compose_jar" ]; then
            echo "ANDROID_COMPOSE_CLASSPATH=${platform_jar}:${compose_jar}" >> "$GITHUB_ENV"
            echo "exported ANDROID_COMPOSE_CLASSPATH for the kotlinc codegen check"
          else
            echo "Android/Compose toolchain not fully provisioned (missing ${platform_jar}${compose_jar:+ or compose-compiler jar}); ANDROID_COMPOSE_CLASSPATH left unset (kotlinc check will skip)"
          fi

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo doc
        run: cargo doc --no-deps --workspace
