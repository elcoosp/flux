# Standalone changelog + release — for repos WITHOUT a release.yml.
# Generates CHANGELOG.md AND creates a GitHub release.

name: Changelog

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    uses: elcoosp/docs-toolkit/.github/workflows/changelog.yml@main
    with:
      mode: release
    secrets: inherit
