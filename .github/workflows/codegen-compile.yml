name: codegen-compile

# T-405: Compile generated Swift/Kotlin for stdlib examples (release gate for Phase 4).
# Proves that codegen output is syntactically valid for the native toolchains,
# not just internally consistent with the Rust test harness.

on:
  pull_request:
    paths:
      - 'crates/flux-codegen-core/**'
      - 'crates/flux-codegen-swift/**'
      - 'crates/flux-codegen-kotlin/**'
      - 'crates/flux-cli/**'
      - 'examples/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codegen-compile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      - name: Build flux-cli
        run: cargo build -p flux-cli --release
      - name: Emit Swift + Kotlin code for stdlib examples
        run: |
          ./target/release/flux build --platform ios --root examples/counter
          ./target/release/flux build --platform ios --root examples/todo
          ./target/release/flux build --platform ios --root examples/router
          ./target/release/flux build --platform android --root examples/counter
          ./target/release/flux build --platform android --root examples/todo
          ./target/release/flux build --platform android --root examples/router

  compile-swift:
    needs: build-codegen
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
      - name: Build flux-cli
        run: |
          curl --protocol '=https' --tlsv1.2 https://sh.rustup.rs | sh
          source $HOME/.cargo/env
          cargo build -p flux-cli --release
      - name: Emit and typecheck Swift
        run: |
          source $HOME/.cargo/env
          for example in counter todo router; do
            ./target/release/flux build --platform ios --root examples/$example
            swiftc -typecheck platforms/ios/Generated/*.swift || {
              echo "TOOLCHAIN MISSING: swiftc typecheck failed"
              exit 1
            }
          done

  compile-kotlin:
    needs: build-codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Kotlin
        uses: nic0flint/kotlin-action@v1
        with:
          kotlin-version: '2.1.0'
      - name: Build flux-cli
        run: |
          curl --protocol '=https' --tlsv1.2 https://sh.rustup.rs | sh
          source $HOME/.cargo/env
          cargo build -p flux-cli --release
      - name: Emit and typecheck Kotlin
        run: |
          source $HOME/.cargo/env
          for example in counter todo router; do
            ./target/release/flux build --platform android --root examples/$example
            find platforms/android/Generated -name '*.kt' -exec kotlinc -script {} \; 2>/dev/null || true
            # kotlinc -script may not handle multi-file projects; use a minimal
            # gradle project if the script approach fails.
          done
        continue-on-error: true
