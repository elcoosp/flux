name: devtools-nightly-canary

# FLUX-090 (LANE-DEVTOOLS, Phase 3 — DX/stability) — Nightly-toolchain canary.
#
# `flux-devtools-ui` requires a nightly toolchain (gpui uses unstable std, e.g.
# `std::hint::cold_path`); the workspace `rust-toolchain.toml` now pins an
# EXACT nightly (see FLUX-090 step 1) so local/contributor builds are
# reproducible and protected from a drifting floating nightly.
#
# This job is the forward-looking counterpart: it builds AND tests
# `flux-devtools-ui` against the *next* (floating) `+nightly` toolchain, so a
# toolchain break is caught BEFORE the pinned nightly is bumped — not after
# contributors are already blocked.
#
# Non-blocking by design (nightly can be flaky for unrelated reasons): the job
# is `continue-on-error` and, on failure, opens/updates a tracking issue
# instead of failing any merge gate. Promote to blocking only if it proves
# stable over time.

on:
  # Daily, off-peak UTC — catch a break the morning after a nightly ships.
  schedule:
    - cron: "17 4 * * *"
  # Manual trigger for ad-hoc checks (e.g. after bumping the pin).
  workflow_dispatch:
  # Re-validate when the pin or the DevTools crate changes.
  push:
    paths:
      - "rust-toolchain.toml"
      - "crates/flux-devtools-ui/**"
      - ".github/workflows/devtools-nightly-canary.yml"

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  canary:
    name: flux-devtools-ui @ next nightly (non-blocking)
    runs-on: ubuntu-latest
    # Best-effort: never block a merge on the floating nightly.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install floating nightly toolchain
        # Force the FLOATING `nightly` (the "next" nightly) explicitly, so this
        # does NOT read the pinned `rust-toolchain.toml`. The canary commands
        # below also carry `+nightly` to make the override unambiguous.
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        # Prebuilt binary on PATH (toolchain-agnostic), so `cargo +nightly
        # nextest` resolves regardless of which toolchain is active.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo check @ next nightly
        run: cargo +nightly check -p flux-devtools-ui --all-targets

      - name: cargo nextest @ next nightly
        run: cargo +nightly nextest run -p flux-devtools-ui

      - name: Open/update canary issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[canary] flux-devtools-ui breaks on next Rust nightly";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The `devtools-nightly-canary` workflow failed building/testing",
              "`flux-devtools-ui` against the floating `+nightly` toolchain.",
              "",
              `Run: ${runUrl}`,
              "",
              "This is a non-blocking early-warning canary (FLUX-090). A break here",
              "means the next `nightly` is incompatible with the pinned gpui /",
              "toolchain. Bump `rust-toolchain.toml` only after confirming a fix",
              "or a newer compatible nightly — do NOT let it float.",
            ].join("\n");
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100,
            });
            const found = existing.data.find((i) => i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: found.number,
                body: `Still failing — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: ["ci", "devtools"],
              });
            }
