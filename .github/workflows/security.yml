name: security

# FLUX §1.3 / AGENTS.md: the audit noted no workflow actually runs `cargo
# audit` or its equivalents, so advisories against any workspace dependency
# (Rust, website/, editors/vscode) could sit unreported indefinitely. This
# workflow runs on every push to main, every PR, and weekly to catch an
# advisory disclosed between code changes.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo-audit
        run: cargo audit --deny warnings

  rust-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  node-audit:
    name: pnpm audit (website + vscode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Audit website
        if: ${{ hashFiles('website/package.json') != '' }}
        run: pnpm --dir website install --frozen-lockfile && pnpm --dir website audit --audit-level high
      - name: Audit vscode extension
        if: ${{ hashFiles('editors/vscode/package.json') != '' }}
        run: pnpm --dir editors/vscode install --frozen-lockfile && pnpm --dir editors/vscode audit --audit-level high
