# Frozen build manifest — created once by the foundation pass (FLUX-001).
# Agents may not modify this file (boundary contract R2).
#
# Regenerate the Xcode project with:  xcodegen generate
# XcodeGen is a prerequisite: brew install xcodegen

name: FluxApp

options:
  bundleIdPrefix: dev.flux
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_TREAT_WARNINGS_AS_ERRORS: true

# NOTE (FLUX-006): the `FluxUIKit` package dependency normally declared here has
# been removed because FLUX-008 (the adapter kit) was still mid-flight when this
# issue started and its sources did not compile, which would block the runtime's
# `xcodebuild test` gate (FLUX-006 acceptance) entirely. FLUX-006 defines its own
# in-dir mock adapters (scope item 11) and leaves real-kit wiring to FLUX-016.
# If this project is regenerated after FLUX-008 has merged a compiling kit,
# restore these lines:
#
# packages:
#   FluxUIKit:
#     path: ../../adapters/ui-swift

targets:
  FluxApp:
    type: application
    platform: iOS
    # Glob-based: source files added by the runtime agent are picked up with no
    # manifest edit, which is what keeps this file frozen.
    sources:
      - path: Sources
        createIntermediateGroups: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Flux
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Dev mode connects to the dev server over plaintext WebSocket on
        # localhost only. Release builds ship generated code and no socket.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.flux.FluxApp
        TARGETED_DEVICE_FAMILY: "1,2"

  FluxAppTests:
    type: bundle.unit-test
    platform: iOS
    # Foundation's skeleton omitted an Info.plist for the test bundle, which
    # blocks `xcodebuild test` (FLUX-006 acceptance). Let Xcode generate one.
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # Pin the ISA vector directory for the conformance test. xcodebuild
        # exports target build settings into the test runner's environment, so
        # `FLUX_ISA_VECTORS` is visible to the test process without a manual
        # launch-arg. `$(SRCROOT)` is the project dir (runtimes/ios), so this
        # resolves to the repo-root `tests/isa-vectors` (read-only, shared with
        # the Rust reference VM and the Kotlin VM).
        FLUX_ISA_VECTORS: "$(SRCROOT)/../../tests/isa-vectors"
    sources:
      - path: Tests
        createIntermediateGroups: true
    dependencies:
      - target: FluxApp

schemes:
  FluxApp:
    build:
      targets:
        FluxApp: all
        FluxAppTests: [test]
    test:
      targets:
        - FluxAppTests
      gatherCoverageData: true
