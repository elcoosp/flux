[workspace]
resolver = "3"
members = [
    "crates/flux-syntax",
    "crates/flux-parser",
    "crates/flux-types",
    "crates/flux-ir",
    "crates/flux-ir-serde",
    "crates/flux-differ",
    "crates/flux-vm-ref",
    "crates/flux-devserver",
    "crates/flux-codegen-swift",
    "crates/flux-codegen-kotlin",
    "crates/flux-cli",
    "crates/flux-parity",
    "crates/flux-devtools-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/flux-lang/flux"

[workspace.dependencies]
flux-syntax = { path = "crates/flux-syntax" }
flux-parser = { path = "crates/flux-parser" }
flux-types = { path = "crates/flux-types" }
flux-ir = { path = "crates/flux-ir" }
flux-ir-serde = { path = "crates/flux-ir-serde" }
flux-differ = { path = "crates/flux-differ" }
flux-vm-ref = { path = "crates/flux-vm-ref" }
flux-devserver = { path = "crates/flux-devserver" }
flux-codegen-swift = { path = "crates/flux-codegen-swift" }
flux-codegen-kotlin = { path = "crates/flux-codegen-kotlin" }

flux-devtools-ui = { path = "crates/flux-devtools-ui" }

# gpui (Zed's retained-mode UI framework) is approved ONLY for the
# `flux-devtools-ui` DevTools desktop crate (ADR-0041). It is a git dependency
# because gpui is not published to crates.io. Pinned to a `main` commit; bump
# deliberately via ADR when upgrading.
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "1ff7cb669b6351eaf2a5b79ccb40f5cd1676b8f8" }

ahash = "^0.8"
anyhow = "^1"
axum = "^0.8"
blake3 = "^1"
bytes = "^1"
futures-util = "^0.3"
clap = { version = "^4", features = ["derive"] }
criterion = "^0.8"
insta = "^1"
notify = "^8"
parking_lot = "^0.12"
pest = "^2"
pest_derive = "^2"
proptest = "^1"
rmp-serde = "^1"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
smallvec = { version = "^1", features = ["union"] }
tempfile = "^3"
thiserror = "^2"
tokio = { version = "^1", features = ["full"] }
tokio-tungstenite = "^0.30"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
