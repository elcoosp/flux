[workspace]
resolver = "3"
members = [
    "crates/flux-syntax",
    "crates/flux-parser",
    "crates/flux-types",
    "crates/flux-ir",
    "crates/flux-ir-serde",
    "crates/flux-differ",
    "crates/flux-vm-ref",
    "crates/flux-devserver",
    "crates/flux-codegen-swift",
    "crates/flux-codegen-kotlin",
    "crates/flux-codegen-core",
    "crates/flux-cli",
    "crates/flux-parity",
    "crates/flux-devtools-ui",
    "crates/flux-lsp",
    "crates/flux-perf-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# `rust-version` is the edition-2024 language floor. The actual toolchain is
# nightly (see `rust-toolchain.toml`): the `flux-devtools-ui` crate's `gpui-ui`
# feature pins gpui at a `main` commit that uses unstable std features
# (e.g. `std::hint::cold_path`), so stable cannot build `--all-features`.
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/elcoosp/flux"

[workspace.dependencies]
flux-syntax = { path = "crates/flux-syntax" }
flux-parser = { path = "crates/flux-parser" }
flux-types = { path = "crates/flux-types" }
flux-ir = { path = "crates/flux-ir" }
flux-ir-serde = { path = "crates/flux-ir-serde" }
flux-differ = { path = "crates/flux-differ" }
flux-vm-ref = { path = "crates/flux-vm-ref" }
flux-devserver = { path = "crates/flux-devserver" }
flux-codegen-swift = { path = "crates/flux-codegen-swift" }
flux-codegen-kotlin = { path = "crates/flux-codegen-kotlin" }
flux-codegen-core = { path = "crates/flux-codegen-core" }

flux-devtools-ui = { path = "crates/flux-devtools-ui" }
flux-lsp = { path = "crates/flux-lsp" }

# gpui (Zed's retained-mode UI framework) is approved ONLY for the
# `flux-devtools-ui` DevTools desktop crate (ADR-0041). It is a git dependency
# because gpui is not published to crates.io. Pinned to a `main` commit; bump
# deliberately via ADR when upgrading.
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "1ff7cb669b6351eaf2a5b79ccb40f5cd1676b8f8" }
# `gpui_platform` is the mandatory desktop companion to `gpui`: it provides the
# concrete `Platform` (winit/AppKit) and `current_platform()` that
# `Application::with_platform` requires. Without it a `gpui` app cannot be
# launched (ADR-0041 pins gpui to a `main` commit; this is the same rev). Added
# while porting `flux-devtools-ui` to the current gpui API (the `Application::new`
# entry point was removed upstream).
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "1ff7cb669b6351eaf2a5b79ccb40f5cd1676b8f8" }

# gpui-component (Longbridge) provides polished, production-ready desktop UI
# primitives (panels, tabs, tables, status bars, badges) for the DevTools
# surface. Approved via ADR-class vetting (active, Apache-2.0, used in
# Longbridge Pro). It must share the SAME pinned `gpui`/`gpui_platform`/`gpui_macros`
# revision as this workspace (see `[patch]` below) — otherwise Cargo resolves two
# incompatible gpui crates and the DevTools UI fails to type-check.
gpui-component = { git = "https://github.com/longbridge/gpui-component" }

# `lsp-types` (typed LSP protocol structs) back the `flux-lsp` crate (FLUX-024),
# split out of the thin `flux-cli` JSON emitter. Both approved via ADR-class
# dependency vetting (active, MIT/Apache-2.0). `tokio` is already a workspace dep.
async-lsp = "^0.2"
lsp-types = "^0.97"

ahash = "^0.8"
anyhow = "^1"
axum = "^0.8"
blake3 = "^1"
bytes = "^1"
futures-util = "^0.3"
clap = { version = "^4", features = ["derive"] }
criterion = "^0.8"
insta = "^1"
notify = "^8"
parking_lot = "^0.12"
proptest = "^1"
rmp-serde = "^1"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
smallvec = { version = "^1", features = ["union"] }
tempfile = "^3"
thiserror = "^2"
tokio = { version = "^1", features = ["full"] }
tokio-tungstenite = "^0.30"
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
