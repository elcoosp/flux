[package]
name = "flux-lsp"
description = "Language server for the Flux UI language (FLUX-024/FLUX-029), built on async-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# async-lsp is the LSP framework (tower-based). Enable `tokio` so the stdio
# server runs on the workspace's tokio runtime; `lsp_types` is re-exported by
# async-lsp (no separate `lsp-types` dependency needed in this crate).
async-lsp = { version = "^0.2", features = ["tokio"] }
tokio = { workspace = true }
futures = "^0.3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# The server REUSES the compiler (PRD-O) — never re-implements analysis.
flux-parser.workspace = true
flux-types.workspace = true
flux-syntax.workspace = true
flux-ir.workspace = true
# `flux-codegen-core` exposes the ADR-0047 primitive registry (authoritative
# prop-name source for FLUX-027 completion) — never a hand-maintained list.
flux-codegen-core.workspace = true

# `serde` renders `LspDiagnostic`s as JSON so the `flux lsp` CLI subcommand and
# non-LSP consumers share the exact wire shape the language server emits
# (AGENTS.md §3.11 - diagnostics never diverge between LSP and CLI).
serde = { workspace = true, features = ["derive"] }

# Spawnable language-server binary consumed by the FLUX-026 VS Code extension
# (and any LSP client) over stdio. The library crate is the canonical home for
# the server loop via `run_stdio`.
[[bin]]
name = "flux-lsp"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
# `tokio-util` compat shim adapts tokio::io::duplex to the AsyncRead/AsyncWrite
# async-lsp expects in the FLUX-024 loopback integration test.
tokio-util = { version = "^0.7", features = ["compat"] }
