[package]
name = "flux-devtools-ui"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
flux-syntax.workspace = true
flux-ir-serde.workspace = true
flux-ir.workspace = true
parking_lot.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
# DevTools binary uses `tracing_subscriber` to surface connection/ingest logs
# on the terminal (the lib only emits `tracing` events, which need a subscriber).
tracing-subscriber.workspace = true
# DevTools websocket client to the dev server's :7333 endpoint.
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util = "^0.3"
# Only this crate depends on gpui (ADR-0041). The pinned gpui build requires a
# nightly toolchain (it uses `std::hint::cold_path`); the workspace toolchain is
# nightly, so gpui is a hard dependency and no longer feature-gated. gpui's
# `font-kit` feature MUST stay enabled or the window renders with no text
# (blank screen) — see the gpui_macos `font-kit` compile warning.
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "1ff7cb669b6351eaf2a5b79ccb40f5cd1676b8f8", default-features = true, features = ["font-kit"] }
# Desktop launcher companion to `gpui`: provides `current_platform()` used by
# `gpui_platform::application()` (the replacement for the removed
# `Application::new()`). Required to launch the DevTools window. Its `font-kit`
# feature must also be enabled for text rendering.
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "1ff7cb669b6351eaf2a5b79ccb40f5cd1676b8f8", features = ["font-kit"] }

[[bin]]
name = "flux-devtools"
path = "src/bin/flux-devtools.rs"
